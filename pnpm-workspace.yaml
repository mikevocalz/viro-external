packages:
  - "packages/*"

overrides:
  # Sibling worktree of the fork on its Specs-preview branch: it carries the
  # Specs compiler and satisfies the >=3.0.1-moyo.0 peer range. ../viro (decax9)
  # has neither and stays on its branch for Harlem-Might.
  "@reactvision/react-viro": "link:../viro-specs-preview"

allowBuilds:
  sharp: true

# Keep pnpm 12 while emitting a single-document lockfile so GitHub's
# dependency graph/Dependabot can continue to parse project dependencies.
pmOnFail: ignore
