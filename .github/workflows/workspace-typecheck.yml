name: Workspace typecheck

# premium-stack.yml covers six packages and xr-platform-validation.yml covers two,
# both path-filtered. That left react-native-viro-mux, viro-external-gui,
# splat-pass, render-passes, orb-pass, webspatial and meta-wearables outside every
# PR-triggered gate. viro3-expo58-refresh.yml does typecheck all of them, but it
# commits and pushes, so it cannot run on pull requests.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout viro-external
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable pnpm 12.8.1
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
          pnpm --version

      - name: Checkout Viro 3 sibling
        run: |
          rm -rf ../viro
          git clone --depth 1 --branch v3.0.1 https://github.com/ReactVision/viro.git ../viro
          node -p "require('../viro/package.json').version"

      - name: Install workspace
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Hydrate linked Viro type resolution
        run: pnpm hydrate:viro-types

      - name: Typecheck every workspace package
        run: pnpm typecheck

      - name: Assert every package is covered
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const missing = fs
            .readdirSync("packages", { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .filter((entry) => {
              const manifest = path.join("packages", entry.name, "package.json");
              if (!fs.existsSync(manifest)) return false;
              const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
              return !pkg.scripts?.typecheck;
            })
            .map((entry) => entry.name);

          if (missing.length > 0) {
            throw new Error(
              `pnpm typecheck silently skips these packages: ${missing.join(", ")}`
            );
          }

          console.log("Every workspace package has a typecheck script.");
          NODE
