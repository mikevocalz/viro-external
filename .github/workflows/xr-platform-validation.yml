name: XR platform adapters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr-platform-adapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/spatial-validation.yml
    with:
      suite: xr
    # Deliberately no secrets: inherit. Private credentials are environment-only.
