name: Viro 3 / Expo 58 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viro3-expo58-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/spatial-validation.yml
    with:
      suite: all
    # Deliberately no secrets: inherit. Private credentials are environment-only.
