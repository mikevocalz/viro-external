name: Viro 3 / Expo 58 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viro3-expo58-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/spatial-validation.yml
    with:
      suite: all
    # Environment-scoped secrets resolve empty inside called workflows unless the
    # caller opts in (actions/runner#4453). inherit passes no repo/org secrets —
    # there are none; the spatial-dependencies environment stays main-only.
    secrets: inherit
