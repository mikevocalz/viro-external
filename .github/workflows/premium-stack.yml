name: Premium spatial stack

on:
  pull_request:
    paths:
      - "packages/media/**"
      - "packages/ui/**"
      - "packages/premium/**"
      - "packages/viro-external-core/**"
      - "packages/pano/**"
      - "packages/viro-external-meta/**"
      - ".github/workflows/premium-stack.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/media/**"
      - "packages/ui/**"
      - "packages/premium/**"
      - "packages/viro-external-core/**"
      - "packages/pano/**"
      - "packages/viro-external-meta/**"
      - ".github/workflows/premium-stack.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-spatial-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout viro-external
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable pnpm 12.8.1
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
          pnpm --version

      - name: Checkout Viro 3 sibling
        run: |
          rm -rf ../viro
          git clone --depth 1 --branch v3.0.1 https://github.com/ReactVision/viro.git ../viro
          node -p "require('../viro/package.json').version"

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile --strict-peer-dependencies=false

      - name: Hydrate linked Viro type resolution without legacy mux
        run: |
          mkdir -p ../viro/node_modules/@types
          ln -sfn "$GITHUB_WORKSPACE/packages/media/node_modules/react" ../viro/node_modules/react
          ln -sfn "$GITHUB_WORKSPACE/packages/media/node_modules/react-native" ../viro/node_modules/react-native
          ln -sfn "$GITHUB_WORKSPACE/packages/media/node_modules/@types/react" ../viro/node_modules/@types/react

      - name: Assert premium graph is Nitro-free
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const roots = [
            "packages/premium/package.json",
            "packages/media/package.json",
            "packages/ui/package.json",
            "packages/viro-external-core/package.json",
            "packages/pano/package.json",
            "packages/viro-external-meta/package.json",
          ];

          for (const file of roots) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const graph = {
              ...(pkg.dependencies || {}),
              ...(pkg.peerDependencies || {}),
              ...(pkg.optionalDependencies || {}),
            };
            for (const dep of Object.keys(graph)) {
              if (
                dep === "react-native-nitro-modules" ||
                dep === "nitrogen" ||
                dep === "react-native-viro-mux"
              ) {
                throw new Error(`${file}: premium path depends on legacy ${dep}`);
              }
            }
          }

          console.log("Premium dependency manifests are Nitro/Mux-free.");
          NODE

      - name: Typecheck premium packages
        run: |
          pnpm --filter @viro-external/core typecheck
          pnpm --filter @viro-external/media typecheck
          pnpm --filter @viro-external/ui typecheck
          pnpm --filter @viro-external/premium typecheck
          pnpm --filter @viro-external/pano typecheck
          pnpm --filter @viro-external/meta typecheck
