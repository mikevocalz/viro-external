name: Checkout compatible Viro fork
description: Trusted-main-only checkout of the pinned SDK 58 spatial fork.
inputs:
  token:
    description: Environment-only token with read-only Contents access to mikevocalz/viro.
    required: true
runs:
  using: composite
  steps:
    - name: Verify trusted context and private dependency access
      shell: bash
      env:
        DEPENDENCY_TOKEN: ${{ inputs.token }}
      run: |
        case "$GITHUB_EVENT_NAME" in
          push|workflow_dispatch) ;;
          *) echo "::error::Private Viro checkout is forbidden on pull-request events."; exit 1 ;;
        esac
        if [ "$GITHUB_REPOSITORY" != "mikevocalz/viro-external" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "::error::Private Viro checkout is restricted to this repository's main branch."
          exit 1
        fi
        if [ -z "$DEPENDENCY_TOKEN" ]; then
          echo "::error::Configure SPATIAL_DEPENDENCIES_TOKEN only in the spatial-dependencies environment, restricted to main. Full private-dependency validation has NOT run. See docs/CI_SECURITY.md."
          exit 1
        fi
    - name: Verify saved credential can read the pinned Viro revision
      shell: bash
      env:
        DEPENDENCY_TOKEN: ${{ inputs.token }}
      run: node scripts/ci/check-viro-access.mjs
    - name: Checkout pinned Viro source
      uses: actions/checkout@v7
      with:
        repository: mikevocalz/viro
        ref: 017d5f8380efdfc88b62812c9c486d199822f6e2
        token: ${{ inputs.token }}
        path: .spatial-deps/viro
        persist-credentials: false
    - name: Place Viro at the workspace link target
      shell: bash
      run: |
        if [ -e ../viro ] || [ -L ../viro ]; then
          echo "::error::Unexpected existing Viro sibling; refusing to overwrite it."
          exit 1
        fi
        mv .spatial-deps/viro ../viro
        node -p "require('../viro/package.json').version"
    # Viro stopped tracking dist/ (viro da1e7f8d). Without it, "types":
    # "dist/index.d.ts" resolves nowhere and TypeScript falls back to viro's
    # index.ts, typechecking the whole fork source under this repo's stricter
    # compiler options. Build the declarations the published package ships,
    # then move Viro's own node_modules out of the link target so the hydrate
    # step can point react, react-native and @types/react at this workspace's
    # single copies.
    - name: Build Viro declarations at the pinned revision
      shell: bash
      working-directory: ../viro
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build
        test -f dist/index.d.ts
        test -z "$(git status --porcelain)"
        mv node_modules "$RUNNER_TEMP/viro-build-node_modules"
